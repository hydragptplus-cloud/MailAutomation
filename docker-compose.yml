services:
  mailhog:
    image: mailhog/mailhog:latest
    expose:
      - "1025"
    ports:
      - "${MAILHOG_UI_PORT:-8025}:8025"
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mailautomation
      POSTGRES_USER: mailuser
      POSTGRES_PASSWORD: mailpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailuser -d mailautomation"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    env_file: .env
    volumes:
      - ./backend:/app
      - ./media:/app/media
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  celery:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A config worker -l INFO --concurrency=4
    env_file: .env
    environment:
      SKIP_MIGRATIONS: "1"
    volumes:
      - ./backend:/app
      - ./media:/app/media
      - ./logs:/app/logs
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_started

  celery-beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A config beat -l INFO
    env_file: .env
    environment:
      SKIP_MIGRATIONS: "1"
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
